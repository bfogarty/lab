name: Setup IAC project
description: Build the nix dev shell, install dependencies, and generate imports.
inputs:
  generate-imports:
    description: Whether to generate module and provider code with `labcli sync-imports`.
    default: "true"
runs:
  using: composite
  steps:
    - name: Install nix
      uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

    - name: Use the Cachix cache
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: bfogarty

    - name: Build the dev shell
      run: nix develop --command true
      shell: bash

    - name: Restore cached Poetry downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('iac/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: nix develop --command just install
      shell: bash

    - name: Restore cached module and provider code
      if: inputs.generate-imports == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: iac/lab/imports
        # bust cache with same set of `LOCKFILES` as `lab.cli.sync_imports`
        key: ${{ runner.os }}-tf-imports-${{ hashFiles('iac/cdktf.json','iac/cdk8s.yaml','iac/poetry.lock','flake.lock') }}
        restore-keys: |
          ${{ runner.os }}-tf-imports-

    - name: Generate module and provider code
      if: inputs.generate-imports == 'true'
      run: nix develop --command just sync-imports
      shell: bash
