name: IAC
on:
  # The repository's rulesets require PRs to be up to date before merge to main,
  # which safely allows skipping deterministic checks like Lint and Test on
  # pushes to main. Pushes to main run only nondeterministic checks, or side
  # effects that only occur on main, like deploying or pushing to caches.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:  # least privilege
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup cdktf project
        uses: ./.github/actions/setup_iac
        with:
          generate-imports: "false"

      - run: nix develop .. --command poetry run ruff check
        working-directory: ./iac

      - run: nix develop .. --command poetry run ruff format --check
        working-directory: ./iac

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup cdktf project
        uses: ./.github/actions/setup_iac

      - run: nix develop .. --command poetry run pytest
        working-directory: ./iac
